appId: com.nextup.desktop
productName: Next up
copyright: Copyright © 2026
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Next up
  uninstallDisplayName: Next up
  artifactName: Next-up-Setup-${version}.${ext}
portable:
  artifactName: Next-up-Portable-${version}.${ext}
