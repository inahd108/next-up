appId: com.nextup.desktop
productName: Next up
copyright: Copyright © 2026
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  # One click, just for the current user: no admin prompt, no wizard, opens when done.
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Next up
  uninstallDisplayName: Next up
  artifactName: Next-up-Setup-${version}.${ext}
